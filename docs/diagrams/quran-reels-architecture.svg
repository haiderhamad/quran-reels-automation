<svg xmlns="http://www.w3.org/2000/svg" width="464" height="723" viewBox="0 0 464 723" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">How a Reel reaches publication</title>
  <desc id="diagram-description">A request starts GitHub Actions. The worker verifies the approved verse, subtitles and recitation, selects screened footage, renders and checks the video, then saves a private MP4. A test ends there. When publishing is enabled, Buffer receives the video. Facebook and Instagram outcomes are recorded separately. Only confirmed Facebook publication advances the catalog.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#20313b" stroke-width=".65"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="5" markerHeight="5" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#b4c6c9" stroke-width="1.5"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f2f6f5}.headline{font-size:26px;font-weight:bold}.label{font-size:21px;font-weight:bold}.detail{font-size:15.5px;fill:#d1dddf}.index{font:600 15px ui-monospace,Menlo,monospace;fill:#b3cccf;text-anchor:middle}</style>
  </defs>
  <rect width="464" height="723" fill="#0d191f"/>
  <rect width="464" height="723" fill="url(#grid)"/>
  <text x="18" y="39" class="headline">How a Reel reaches publication</text>
  <path d="M232 146V165" fill="none" stroke="#b4c6c9" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M232 256V275" fill="none" stroke="#b4c6c9" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M232 366V385" fill="none" stroke="#b4c6c9" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M232 476V495" fill="none" stroke="#b4c6c9" stroke-width="1.7" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M232 586V605" fill="none" stroke="#b4c6c9" stroke-width="1.7" marker-end="url(#arrow)"/>
  <g id="trigger">
    <rect x="18" y="59" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="59" width="428" height="86" rx="9" fill="none" stroke="#73bcd5"/>
    <circle cx="40" cy="83" r="12" fill="#23363b"/>
    <text class="index" x="40" y="88">1</text>
    <text class="label" x="61" y="90">Start a run</text>
    <text class="detail" x="33" y="114">A dashboard request or due schedule starts</text>
    <text class="detail" x="33" y="134">the GitHub Actions worker.</text>
  </g>
  <g id="inputs">
    <rect x="18" y="169" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="169" width="428" height="86" rx="9" fill="none" stroke="#73cfb1"/>
    <circle cx="40" cy="193" r="12" fill="#23363b"/>
    <text class="index" x="40" y="198">2</text>
    <text class="label" x="61" y="200">Verify the inputs</text>
    <text class="detail" x="33" y="224">Check approved verse, subtitles and recitation.</text>
    <text class="detail" x="33" y="244">Choose a previously screened background.</text>
  </g>
  <g id="render">
    <rect x="18" y="279" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="279" width="428" height="86" rx="9" fill="none" stroke="#73cfb1"/>
    <circle cx="40" cy="303" r="12" fill="#23363b"/>
    <text class="index" x="40" y="308">3</text>
    <text class="label" x="61" y="310">Render and check the Reel</text>
    <text class="detail" x="33" y="334">FFmpeg builds the vertical video. The final</text>
    <text class="detail" x="33" y="354">composite must pass the vision scan.</text>
  </g>
  <g id="store">
    <rect x="18" y="389" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="389" width="428" height="86" rx="9" fill="none" stroke="#f0c078"/>
    <circle cx="40" cy="413" r="12" fill="#23363b"/>
    <text class="index" x="40" y="418">4</text>
    <text class="label" x="61" y="420">Save the private MP4</text>
    <text class="detail" x="33" y="444">Backblaze B2 stores the video.</text>
    <text class="detail" x="33" y="464">A private test run ends here.</text>
  </g>
  <g id="buffer">
    <rect x="18" y="499" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="499" width="428" height="86" rx="9" fill="none" stroke="#f0c078"/>
    <circle cx="40" cy="523" r="12" fill="#23363b"/>
    <text class="index" x="40" y="528">5</text>
    <text class="label" x="61" y="530">Send to Buffer</text>
    <text class="detail" x="33" y="554">Publishing must be enabled. Buffer receives</text>
    <text class="detail" x="33" y="574">the video for each connected channel.</text>
  </g>
  <g id="receipts">
    <rect x="18" y="609" width="428" height="86" rx="9" fill="#13252b"/>
    <rect x="18" y="609" width="428" height="86" rx="9" fill="none" stroke="#bea8ee"/>
    <circle cx="40" cy="633" r="12" fill="#23363b"/>
    <text class="index" x="40" y="638">6</text>
    <text class="label" x="61" y="640">Confirm publication</text>
    <text class="detail" x="33" y="664">Supabase tracks Facebook and Instagram separately.</text>
    <text class="detail" x="33" y="684">Only a confirmed Facebook post advances the catalog.</text>
  </g>
</svg>
