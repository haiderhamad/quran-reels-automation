name: Public source checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline Python regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python for CV regression
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python regression dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Prepare verified native Reel runtime
        run: bash scripts/setup_reel_runtime.sh

      - name: Fetch verified renderer fonts
        run: python3 scripts/fetch_fonts.py --offline

      - name: Fetch verified safety models
        run: python3 scripts/fetch_cv_models.py

      - name: Run public Python suite
        run: python3 scripts/run_python_tests.py --fail-on-skip

      - name: Check all reachable history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_repository_safety.py
      - run: python3 scripts/check_repository_safety.py --all-local-refs

  dashboard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
