name: Qualify Background Candidates

on:
  schedule:
    # Full-source person/face/animal CV qualification twice daily, after discovery (UTC).
    - cron: "37 2,14 * * *"
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Maximum candidates to qualify in this run (normally 3)"
        required: false
        default: "3"
        type: string
      target_selectable:
        description: "Adaptive target for selectable verified assets"
        required: false
        default: "250"
        type: string

permissions:
  contents: read

concurrency:
  group: quran-reels-background-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Screening is independently opt-in; never enable Reel publishing as a side effect.
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_BACKGROUND_ENABLED == 'true' && vars.BACKGROUND_QUALIFICATION_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python3 -m pip install -r requirements.txt
      - name: Cache visual safety models
        id: cache-cv-models
        uses: actions/cache@v4
        with:
          path: .cache/cv_models
          key: cv-models-${{ hashFiles('scripts/fetch_cv_models.py') }}
      - name: Fetch pinned safety models
        run: python3 scripts/fetch_cv_models.py
      - name: Qualify background candidate
        env:
          STATE_AUTHORITY: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
          WORKFLOW_MAX_CANDIDATES: ${{ inputs.max_candidates || '3' }}
          WORKFLOW_TARGET_SELECTABLE: ${{ inputs.target_selectable || '250' }}
        run: |
          python3 -u scripts/run_background_qualification.py \
            --max-candidates "$WORKFLOW_MAX_CANDIDATES" \
            --target-selectable "$WORKFLOW_TARGET_SELECTABLE"
