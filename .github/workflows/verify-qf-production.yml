name: Verify Quran Foundation Production Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-qf-production:
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_PRODUCTION_ENABLED == 'true' }}
    name: Verify Quran Foundation Production Source (Read-Only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal dependencies
        run: python3 -m pip install certifi

      - name: Verify Quran Foundation Production Source (Read-Only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          QF_CLIENT_ID: ${{ secrets.QF_PRODUCTION_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_PRODUCTION_CLIENT_SECRET }}
          QF_ENV: production
        run: python3 -u scripts/verify_qf_production_source.py
