name: Discover Background Candidates

on:
  schedule:
    # One daily metadata-only prescan (UTC), ahead of the first CV qualification.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Maximum metadata candidates to enqueue"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: quran-reels-background-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Screening is independently opt-in; never enable Reel publishing as a side effect.
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_BACKGROUND_ENABLED == 'true' && vars.BACKGROUND_DISCOVERY_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      - name: Enqueue metadata-only background candidates
        env:
          STATE_AUTHORITY: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PYTHONUNBUFFERED: "1"
          WORKFLOW_MAX_CANDIDATES: ${{ inputs.max_candidates || '20' }}
        run: python3 -u scripts/discover_background_candidates.py --max-candidates "$WORKFLOW_MAX_CANDIDATES"
