name: Verify Existing Facebook Reel (Read Only)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Existing owner-v1 RunRecord ID with a Buffer post ID; no new post is created"
        required: true
        type: string
      both_channels:
        description: "Also verify the matching Instagram post and return receipt evidence (no writes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: owner-v1-facebook-readonly
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_V1_READ_ONLY_VERIFICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Prepare pinned Rowwad source
        env:
          ROWWAD_REFERENCE_OBJECT_KEY: ${{ secrets.ROWWAD_REFERENCE_OBJECT_KEY }}
          ROWWAD_REFERENCE_GZIP_SHA256: ${{ vars.ROWWAD_REFERENCE_GZIP_SHA256 }}
          B2_ENDPOINT: ${{ secrets.ROWWAD_REFERENCE_B2_ENDPOINT }}
          B2_REGION: ${{ secrets.ROWWAD_REFERENCE_B2_REGION }}
          B2_BUCKET_NAME: ${{ secrets.ROWWAD_REFERENCE_B2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.ROWWAD_REFERENCE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.ROWWAD_REFERENCE_B2_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m scripts.prepare_rowwad_reference --public-if-unconfigured --destination-dir "$RUNNER_TEMP/rowwad1019"
          printf 'QURAN_REELS_TRANSLATION_CACHE_DIR=%s\n' "$RUNNER_TEMP/rowwad1019/cache" >> "$GITHUB_ENV"

      - name: Read the existing Facebook delivery from Buffer without posting or saving
        env:
          OWNER_V1_INSPECT_RUN_ID: ${{ inputs.run_id }}
          # The receipt verifier revalidates Quran source identity with read-only credentials.
          QF_CLIENT_ID: ${{ secrets.QF_PRODUCTION_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_PRODUCTION_CLIENT_SECRET }}
          QF_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          INSPECT_BOTH: ${{ inputs.both_channels }}
          PUBLIC_MEDIA_DELIVERY_ORIGIN: ${{ vars.PUBLIC_MEDIA_DELIVERY_ORIGIN }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=(--run-id "$OWNER_V1_INSPECT_RUN_ID")
          if [[ "$INSPECT_BOTH" == "true" ]]; then args+=(--both); fi
          python3 -m scripts.verify_calm_reels_facebook_delivery "${args[@]}"
