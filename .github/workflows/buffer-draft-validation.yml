name: Buffer Facebook Reel Draft Validation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Existing final-safety-passed TEST RunRecord ID"
        required: true
        type: string
      confirm_create_nonpublic_draft:
        description: "Create exactly one non-public Buffer draft, then delete it"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: buffer-draft-validation-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  buffer-draft-validation:
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_PRODUCTION_ENABLED == 'true' && inputs.confirm_create_nonpublic_draft == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Create, verify, and delete one Buffer Facebook Reel draft
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          PUBLIC_MEDIA_DELIVERY_ORIGIN: ${{ vars.PUBLIC_MEDIA_DELIVERY_ORIGIN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PREFIX: ${{ secrets.B2_PREFIX || 'quran-reels/' }}
          STATE_AUTHORITY: ${{ secrets.STATE_AUTHORITY || 'supabase' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKFLOW_RUN_ID: ${{ inputs.run_id }}
        run: >-
          python3 -u scripts/buffer_draft_validation.py
          --run-id "$WORKFLOW_RUN_ID"
          --create-draft --delete-after --print-caption
