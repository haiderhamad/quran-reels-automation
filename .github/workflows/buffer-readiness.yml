name: Buffer Readiness Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buffer-readiness:
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_PRODUCTION_ENABLED == 'true' }}
    name: Read-only Buffer account discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Discover intended Buffer Facebook Page (read-only)
        env:
          # Running a file in scripts/ makes scripts/ the import root. Keep the
          # checked-out repository explicitly importable for engine.* modules.
          PYTHONPATH: ${{ github.workspace }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python3 -u scripts/buffer_readiness.py
