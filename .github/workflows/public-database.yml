name: Public database migration acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply migrations to an isolated Supabase PostgreSQL instance
        run: python3 scripts/verify_public_database.py
