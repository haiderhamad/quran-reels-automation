name: Generate Reel

on:
  workflow_call:
    inputs:
      run_kind:
        description: "Run semantics"
        required: true
        type: string
        default: "scheduled"
      schedule_slot_id:
        description: "Stable schedule slot ID (scheduled runs only)"
        required: true
        type: string
      run_id:
        description: "Idempotency ID"
        required: false
        type: string
      publish_facebook:
        description: "Target: Facebook"
        required: false
        type: boolean
        default: true
      publish_instagram:
        description: "Target: Instagram"
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      run_kind:
        description: "Run semantics"
        required: true
        type: choice
        default: "test"
        options:
          - "scheduled"
          - "manual_production"
          - "test"
      schedule_slot_id:
        description: "Stable schedule slot ID (scheduled runs only)"
        required: false
        type: string
      run_id:
        description: "Idempotency ID (manual/test runs; generated when omitted)"
        required: false
        type: string
      force:
        description: "Legacy test-only compatibility flag (never bypasses production idempotency)"
        required: false
        type: boolean
        default: false
      test_verse_key:
        description: "Optional approved test-only verified phrase fixture"
        required: false
        type: string
      publish_facebook:
        description: "Manual production target: Facebook"
        required: false
        type: boolean
        default: true
      publish_instagram:
        description: "Manual production target: Instagram"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: quran-reels-generation
  cancel-in-progress: false

jobs:
  generate-reel:
    # No actions (including test uploads) until this installation is owner-enabled.
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_PRODUCTION_ENABLED == 'true' }}
    name: Generate Quran Reel
    runs-on: ubuntu-24.04
    # The engine stops background acquisition after 10 minutes, leaving up to
    # 20 minutes for final render, final safety scan, B2 upload, and checkpoint.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Prepare verified native Reel runtime
        run: bash scripts/setup_reel_runtime.sh

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Prepare pinned Rowwad source
        env:
          ROWWAD_REFERENCE_OBJECT_KEY: ${{ secrets.ROWWAD_REFERENCE_OBJECT_KEY }}
          ROWWAD_REFERENCE_GZIP_SHA256: ${{ vars.ROWWAD_REFERENCE_GZIP_SHA256 }}
          B2_ENDPOINT: ${{ secrets.ROWWAD_REFERENCE_B2_ENDPOINT }}
          B2_REGION: ${{ secrets.ROWWAD_REFERENCE_B2_REGION }}
          B2_BUCKET_NAME: ${{ secrets.ROWWAD_REFERENCE_B2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.ROWWAD_REFERENCE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.ROWWAD_REFERENCE_B2_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m scripts.prepare_rowwad_reference --public-if-unconfigured --destination-dir "$RUNNER_TEMP/rowwad1019"
          printf 'QURAN_REELS_TRANSLATION_CACHE_DIR=%s\n' "$RUNNER_TEMP/rowwad1019/cache" >> "$GITHUB_ENV"

      - name: Fetch CV models and verified typography fonts
        run: |
          python3 scripts/fetch_cv_models.py
          python3 scripts/fetch_fonts.py --offline

      - name: Validate run semantics
        env:
          RUN_KIND: ${{ inputs.run_kind }}
        run: |
          case "$RUN_KIND" in
            test|scheduled|manual_production)
              echo "Valid run kind"
              ;;
            *)
              echo "::error::Unsupported run kind. Must be 'test', 'scheduled', or 'manual_production'."
              exit 1
              ;;
          esac

      - name: Run Quran Reel generation job (test run)
        if: inputs.run_kind == 'test'
        env:
          JOB_RUN_KIND: ${{ inputs.run_kind }}
          JOB_SCHEDULE_SLOT_ID: ${{ inputs.schedule_slot_id }}
          JOB_REQUEST_RUN_ID: ${{ inputs.run_id }}
          JOB_FORCE: ${{ inputs.force }}
          JOB_TEST_VERSE_KEY: ${{ inputs.test_verse_key }}
          JOB_PUBLISH_FACEBOOK: ${{ inputs.publish_facebook }}
          JOB_PUBLISH_INSTAGRAM: ${{ inputs.publish_instagram }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_ENV: prelive
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PREFIX: ${{ secrets.B2_PREFIX || 'quran-reels/' }}
          STATE_AUTHORITY: ${{ secrets.STATE_AUTHORITY || 'supabase' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Phase 8A: Buffer is the only active social publisher.  The flags
          # default false, so a key alone can never activate public posting.
          PUBLISHER_BACKEND: ${{ vars.PUBLISHER_BACKEND || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_PUBLISHING_ENABLED: ${{ vars.BUFFER_PUBLISHING_ENABLED || 'false' }}
          BUFFER_FACEBOOK_ENABLED: ${{ vars.BUFFER_FACEBOOK_ENABLED || 'false' }}
          BUFFER_INSTAGRAM_ENABLED: ${{ vars.BUFFER_INSTAGRAM_ENABLED || 'false' }}
          PUBLIC_MEDIA_DELIVERY_ORIGIN: ${{ vars.PUBLIC_MEDIA_DELIVERY_ORIGIN }}
          RECITER_REUSE_CONFIRMED: ${{ secrets.RECITER_REUSE_CONFIRMED || vars.RECITER_REUSE_CONFIRMED || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          job_args=(--run-kind "${JOB_RUN_KIND:-test}")
          if [ -n "${JOB_SCHEDULE_SLOT_ID:-}" ]; then
            job_args+=(--schedule-slot-id "$JOB_SCHEDULE_SLOT_ID")
          fi
          if [ -n "${JOB_REQUEST_RUN_ID:-}" ]; then
            job_args+=(--run-id "$JOB_REQUEST_RUN_ID")
          fi
          if [ "${JOB_FORCE:-false}" = "true" ]; then
            job_args+=(--force)
          fi
          if [ -n "${JOB_TEST_VERSE_KEY:-}" ]; then
            job_args+=(--test-verse-key "$JOB_TEST_VERSE_KEY")
          fi
          if [ "${JOB_PUBLISH_FACEBOOK:-true}" = "true" ]; then
            job_args+=(--publish-facebook)
          else
            job_args+=(--no-publish-facebook)
          fi
          if [ "${JOB_PUBLISH_INSTAGRAM:-true}" = "true" ]; then
            job_args+=(--publish-instagram)
          else
            job_args+=(--no-publish-instagram)
          fi
          python3 -u -m engine.job "${job_args[@]}"

      - name: Run Quran Reel generation job (production run)
        if: inputs.run_kind == 'scheduled' || inputs.run_kind == 'manual_production'
        env:
          JOB_RUN_KIND: ${{ inputs.run_kind }}
          JOB_SCHEDULE_SLOT_ID: ${{ inputs.schedule_slot_id }}
          JOB_REQUEST_RUN_ID: ${{ inputs.run_id }}
          JOB_FORCE: ${{ inputs.force }}
          JOB_TEST_VERSE_KEY: ${{ inputs.test_verse_key }}
          JOB_PUBLISH_FACEBOOK: ${{ inputs.publish_facebook }}
          JOB_PUBLISH_INSTAGRAM: ${{ inputs.publish_instagram }}
          # Frozen owner-v1: preview by default; publishing needs an explicit
          # independent opt-in and the authoritative Supabase claim RPC.
          QURAN_REELS_V1_MODE: ${{ vars.QURAN_REELS_V1_MODE || 'preview' }}
          QURAN_REELS_V1_PUBLISH_ENABLED: ${{ vars.QURAN_REELS_V1_PUBLISH_ENABLED || 'false' }}
          QF_CLIENT_ID: ${{ secrets.QF_PRODUCTION_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_PRODUCTION_CLIENT_SECRET }}
          QF_ENV: production
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PREFIX: ${{ secrets.B2_PREFIX || 'quran-reels/' }}
          STATE_AUTHORITY: ${{ secrets.STATE_AUTHORITY || 'supabase' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Phase 8A: Buffer is the only active social publisher.  The flags
          # default false, so a key alone can never activate public posting.
          PUBLISHER_BACKEND: ${{ vars.PUBLISHER_BACKEND || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_PUBLISHING_ENABLED: ${{ vars.BUFFER_PUBLISHING_ENABLED || 'false' }}
          BUFFER_FACEBOOK_ENABLED: ${{ vars.BUFFER_FACEBOOK_ENABLED || 'false' }}
          BUFFER_INSTAGRAM_ENABLED: ${{ vars.BUFFER_INSTAGRAM_ENABLED || 'false' }}
          PUBLIC_MEDIA_DELIVERY_ORIGIN: ${{ vars.PUBLIC_MEDIA_DELIVERY_ORIGIN }}
          RECITER_REUSE_CONFIRMED: ${{ secrets.RECITER_REUSE_CONFIRMED || vars.RECITER_REUSE_CONFIRMED || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          job_args=(--run-kind "${JOB_RUN_KIND:-test}")
          if [ -n "${JOB_SCHEDULE_SLOT_ID:-}" ]; then
            job_args+=(--schedule-slot-id "$JOB_SCHEDULE_SLOT_ID")
          fi
          if [ -n "${JOB_REQUEST_RUN_ID:-}" ]; then
            job_args+=(--run-id "$JOB_REQUEST_RUN_ID")
          fi
          if [ "${JOB_FORCE:-false}" = "true" ]; then
            job_args+=(--force)
          fi
          if [ -n "${JOB_TEST_VERSE_KEY:-}" ]; then
            job_args+=(--test-verse-key "$JOB_TEST_VERSE_KEY")
          fi
          if [ "${JOB_PUBLISH_FACEBOOK:-true}" = "true" ]; then
            job_args+=(--publish-facebook)
          else
            job_args+=(--no-publish-facebook)
          fi
          if [ "${JOB_PUBLISH_INSTAGRAM:-true}" = "true" ]; then
            job_args+=(--publish-instagram)
          else
            job_args+=(--no-publish-instagram)
          fi
          python3 -u -m engine.job "${job_args[@]}"
