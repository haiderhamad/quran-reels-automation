name: Archive Monthly Reels

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Completed archive year (optional; defaults to previous Berlin month)"
        required: false
        type: string
      month:
        description: "Completed archive month 1-12 (optional; defaults to previous Berlin month)"
        required: false
        type: string
      dry_run:
        description: "Plan only; never download, upload, or delete media"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: quran-reels-monthly-archive
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.QURAN_REELS_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Plan or archive the completed month
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_PREFIX: ${{ secrets.B2_PREFIX || 'quran-reels/' }}
          RCLONE_CONFIG_GOOGLE_DRIVE: ${{ secrets.RCLONE_CONFIG_GOOGLE_DRIVE }}
          GOOGLE_DRIVE_RCLONE_REMOTE: ${{ secrets.GOOGLE_DRIVE_RCLONE_REMOTE }}
          GOOGLE_DRIVE_ARCHIVE_ROOT: ${{ secrets.GOOGLE_DRIVE_ARCHIVE_ROOT }}
          ARCHIVE_YEAR: ${{ inputs.year }}
          ARCHIVE_MONTH: ${{ inputs.month }}
          ARCHIVE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ -n "$ARCHIVE_YEAR" ]]; then args+=(--year "$ARCHIVE_YEAR"); fi
          if [[ -n "$ARCHIVE_MONTH" ]]; then args+=(--month "$ARCHIVE_MONTH"); fi
          if [[ "$ARCHIVE_DRY_RUN" != false ]]; then args+=(--dry-run); fi
          python3 scripts/archive_monthly_reels.py "${args[@]}"
